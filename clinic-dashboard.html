<!DOCTYPE html>
<html lang="en" data-auth-required><!-- protected: only signed-in, verified staff (see assets/js/auth.js) -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Dashboard · SNMC Law Legal Clinic</title>
  <meta name="robots" content="noindex, nofollow"><!-- staff page: keep it out of search results -->

  <!-- ===== Shared head: keep identical on every page ===== -->
  <!-- Where this page may load scripts, styles, images and data from. Add a host here when you add a CDN library or API (README → "Security"). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://capi.snmclaw.com; connect-src 'self' https://capi.snmclaw.com; frame-src https://challenges.cloudflare.com https://maps.google.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="assets/img/snmc-legal-aid.svg">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/preloader.js"></script><!-- logo preloader: not deferred, it covers the first paint -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js" integrity="sha384-2ql948lIdLcGEE0/qxNiudyTjgauA3RDJERu5xW75kFCvSl5a9odyQYCb6tEjnmB" crossorigin="anonymous" defer></script><!-- deferred: the preloader covers the page until the styles are built -->
  <script src="assets/js/components.js" defer></script>
  <script src="assets/js/components/site-header.js" defer></script>
  <script src="assets/js/components/site-footer.js" defer></script>
  <script src="assets/js/components/page-intro.js" defer></script>
  <script src="assets/js/components/legal-notice.js" defer></script>
  <script src="assets/js/components/contact-info.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.28.1/dist/pocketbase.umd.js" integrity="sha384-Pr74Q4nJqBcqXYMrsOS8tSw8t8N0Nayn7pWqFRdz9MsePI7uo55HNdxwrCcIRD8e" crossorigin="anonymous"></script><!-- page-specific: PocketBase SDK -->
  <script src="assets/js/auth.js"></script><!-- page-specific: checks the session before showing the page -->
  <script src="assets/js/components/dashboard-sidebar.js" defer></script><!-- page-specific: staff sidebar -->
  <script src="assets/js/crud.js" defer></script><!-- page-specific: shared table logic -->
  <script src="assets/js/intake.js" defer></script><!-- page-specific: shared booking helpers -->
  <script src="assets/js/clinic-records.js" defer></script><!-- page-specific: who can be assigned -->
  <script src="assets/js/appointments.js" defer></script><!-- page-specific: statuses, Manila time helpers -->
  <script src="assets/js/dashboard.js" defer></script><!-- page-specific, must come before Alpine -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js" integrity="sha384-FYLKjwG3aohNhNZoVG8sY/5ntunm+MqylL90Q+rT3OM7AwV9/BKFjk/RjoIpIgsI" crossorigin="anonymous" defer></script>
  <!-- ===== /Shared head ===== -->
</head>
<body x-data="dashboard" class="bg-cream text-ink">
  <dashboard-sidebar active="dashboard"></dashboard-sidebar>

  <div class="lg:pl-64">
    <header class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-black/10 bg-cream/95 px-4 backdrop-blur sm:px-6 lg:px-8">
      <button type="button" class="-ml-2 rounded-sm p-2 lg:hidden" @click="$dispatch('open-sidebar')" aria-label="Open menu">
        <svg class="size-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 class="text-2xl">Dashboard</h1>
      <a href="clinic-appointments.html" class="ml-auto hidden text-sm font-semibold text-copper-dark hover:underline sm:inline">All appointments →</a>
      <a href="clinic-intake.html" class="btn btn-primary ml-auto shrink-0 px-4 py-2 sm:ml-0">
        <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New intake
      </a>
    </header>

    <main class="px-4 py-8 sm:px-6 lg:px-8">
      <div class="space-y-8">

        <!-- Summary cards -->
        <div class="grid grid-cols-2 gap-4 lg:grid-cols-3 2xl:grid-cols-6">
          <template x-for="stat in stats" :key="stat.key">
            <div class="rounded-md bg-paper p-5 shadow-sm ring-1 ring-black/5">
              <p class="text-sm text-muted" x-text="stat.label"></p>
              <p class="mt-2 font-display text-4xl text-ink" x-text="stat.value"></p>
            </div>
          </template>
        </div>

        <!-- Needs attention: only shows when something has slipped (loadAttention in dashboard.js) -->
        <section x-show="attention.length" x-cloak class="rounded-md bg-paper p-5 shadow-sm ring-1 ring-amber/40 sm:p-6" aria-labelledby="attention-title">
          <h2 id="attention-title" class="text-2xl">Needs attention</h2>
          <ul class="mt-4 divide-y divide-black/5 text-sm">
            <template x-for="line in attention" :key="line.key">
              <li class="flex flex-wrap items-baseline gap-x-3 gap-y-1 py-2.5">
                <span class="min-w-6 rounded-full bg-amber/15 px-2 py-0.5 text-center text-xs font-semibold text-[#8a5a1c]" x-text="line.count"></span>
                <span class="font-semibold" x-text="line.label"></span>
                <span class="flex flex-wrap gap-x-2 text-copper-dark">
                  <template x-for="item in line.items" :key="item.id">
                    <a class="font-mono text-xs hover:underline" :href="item.href" x-text="item.reference"></a>
                  </template>
                  <span x-show="line.count > line.items.length" class="text-xs text-muted" x-text="`and ${line.count - line.items.length} more`"></span>
                </span>
              </li>
            </template>
          </ul>
        </section>

        <!-- Upcoming appointments -->
        <section class="rounded-md bg-paper shadow-sm ring-1 ring-black/5" aria-labelledby="upcoming-title">
          <div class="flex flex-col gap-4 border-b border-black/10 p-5 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
              <div class="flex flex-wrap items-baseline gap-x-4 gap-y-1">
                <h2 id="upcoming-title" class="text-2xl" x-text="view === 'calendar' ? 'Appointment calendar' : 'Upcoming appointments'"></h2>
                <p class="text-sm text-muted" x-text="view === 'calendar' ? 'Pick a day, then click an appointment to assign an LSP and lawyer.' : sortKey === 'scheduled_at' ? 'From today, soonest first. Click one to open it.' : 'From today, most urgent first. Click one to open it.'"></p>
              </div>
              <div class="inline-flex rounded-md bg-cream p-1 ring-1 ring-black/10" role="group" aria-label="Appointments view">
                <button type="button" class="rounded-sm px-3 py-1.5 text-sm font-semibold" :class="view === 'list' ? 'bg-paper shadow-sm ring-1 ring-black/10' : 'text-muted hover:text-ink'" :aria-pressed="view === 'list'" @click="view = 'list'">List</button>
                <button type="button" class="rounded-sm px-3 py-1.5 text-sm font-semibold" :class="view === 'calendar' ? 'bg-paper shadow-sm ring-1 ring-black/10' : 'text-muted hover:text-ink'" :aria-pressed="view === 'calendar'" @click="view = 'calendar'">Calendar</button>
              </div>
            </div>

            <!-- Controls -->
            <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-[2fr_1fr_1fr_1fr_auto]">
              <label class="relative block">
                <span class="sr-only">Search appointments</span>
                <svg class="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" x-model.debounce.300ms="search" placeholder="Search client, reference, LSP, lawyer…" class="field pl-9">
              </label>
              <label>
                <span class="sr-only">Filter by status</span>
                <select x-model="statusFilter" class="field">
                  <option value="open">Open (not done or cancelled)</option>
                  <option value="">All statuses</option>
                  <template x-for="s in statuses" :key="s.value"><option :value="s.value" x-text="s.label"></option></template>
                </select>
              </label>
              <label>
                <span class="sr-only">Filter by assignment</span>
                <select x-model="assignFilter" class="field">
                  <option value="">Assigned or not</option>
                  <option value="unassigned">Needs an LSP or lawyer</option>
                </select>
              </label>
              <label x-show="view === 'list' && gateFrom">
                <span class="sr-only">Order</span>
                <select x-model="sortKey" class="field">
                  <option value="urgency_rank,scheduled_at">Most urgent first</option>
                  <option value="scheduled_at">Soonest first</option>
                </select>
              </label>
              <button type="button" class="btn btn-ghost py-2.5 text-ink" @click="clearFilters()" :disabled="!hasFilters">Reset</button>
            </div>
          </div>

          <!-- ===== List view ===== -->
          <!-- Table (scrolls sideways inside the card on small screens) -->
          <div x-show="view === 'list'" class="relative overflow-x-auto">
            <table class="w-full min-w-[800px] text-left text-sm" :aria-busy="loading">
              <thead class="bg-cream/60 text-xs uppercase tracking-wider text-muted">
                <tr>
                  <template x-for="col in columns" :key="col.key">
                    <th scope="col" class="px-3 py-3 first:pl-5 last:pr-5 font-semibold" x-text="col.label"></th>
                  </template>
                </tr>
              </thead>
              <tbody class="divide-y divide-black/5" :class="loading && rows.length && 'opacity-50'">
                <template x-for="row in rows" :key="row.id">
                  <tr class="cursor-pointer hover:bg-cream/50" @click="openRow(row)">
                    <td class="whitespace-nowrap px-3 py-3.5 first:pl-5 last:pr-5">
                      <a :href="'clinic-appointments.html#' + row.id" class="block font-semibold hover:underline" @click.stop x-text="formatSchedule(row.scheduled_at, { time: false })"></a>
                      <span class="text-muted" x-text="formatSchedule(row.scheduled_at).split(' · ')[1]"></span>
                    </td>
                    <td class="px-3 py-3.5 first:pl-5 last:pr-5">
                      <span class="block max-w-[15rem] truncate" x-text="row.title"></span>
                      <span class="block font-mono text-xs text-muted" x-text="row.reference"></span>
                    </td>
                    <td class="whitespace-nowrap px-3 py-3.5 first:pl-5 last:pr-5">
                      <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1" :class="statusClass(row.app_status)" x-text="statusLabel(row.app_status)"></span>
                      <span x-show="needsReceiving(row)" class="block pt-1 text-xs font-semibold text-red-700">To receive</span>
                    </td>
                    <td class="whitespace-nowrap px-3 py-3.5 first:pl-5 last:pr-5">
                      <span x-show="urgencyOf(row.urgency)" class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1" :class="urgencyOf(row.urgency)?.badge" x-text="urgencyOf(row.urgency)?.label"></span>
                      <span x-show="row.client_urgent && !row.urgency" class="inline-flex rounded-full bg-red-600/10 px-2.5 py-0.5 text-xs font-semibold text-red-800 ring-1 ring-red-600/25">Client: urgent</span>
                      <span x-show="!row.urgency && !row.client_urgent" class="text-muted">—</span>
                    </td>
                    <td class="whitespace-nowrap px-3 py-3.5 first:pl-5 last:pr-5" :class="!row.lsp_name && 'italic text-muted'" x-text="row.lsp_name || 'Not assigned'"></td>
                    <td class="whitespace-nowrap px-3 py-3.5 first:pl-5 last:pr-5" :class="!row.sl_name && 'italic text-muted'" x-text="row.sl_name || 'Not assigned'"></td>
                  </tr>
                </template>
                <tr x-show="loading && !rows.length">
                  <td :colspan="columns.length" class="px-5 py-12 text-center text-muted">Loading appointments…</td>
                </tr>
                <tr x-show="!loading && loadError" x-cloak>
                  <td :colspan="columns.length" class="px-5 py-12 text-center">
                    <span class="text-red-700" x-text="loadError"></span>
                    <button type="button" class="ml-2 font-semibold text-copper-dark hover:underline" @click="load()">Try again</button>
                  </td>
                </tr>
                <tr x-show="!loading && !loadError && !rows.length" x-cloak>
                  <td :colspan="columns.length" class="px-5 py-12 text-center text-muted">
                    <span x-show="hasFilters">Nothing upcoming matches these filters. <button type="button" class="ml-1 font-semibold text-copper-dark hover:underline" @click="clearFilters()">Reset</button></span>
                    <span x-show="!hasFilters">No upcoming appointments yet.</span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div x-show="view === 'list'" class="flex flex-col gap-3 border-t border-black/10 px-5 py-4 text-sm sm:flex-row sm:items-center sm:justify-between">
            <div class="flex items-center gap-3 text-muted">
              <span x-text="rangeLabel" aria-live="polite"></span>
              <label class="flex items-center gap-2">
                <span class="sr-only sm:not-sr-only">Rows</span>
                <select x-model.number="perPage" class="rounded-sm border border-black/15 bg-white px-2 py-1 text-ink focus:border-copper focus:outline-none">
                  <option>10</option><option>25</option><option>50</option>
                </select>
              </label>
            </div>
            <nav class="flex items-center gap-1" aria-label="Table pages">
              <button type="button" class="rounded-sm px-3 py-1.5 hover:bg-black/5 disabled:opacity-30 disabled:hover:bg-transparent" @click="goTo(page - 1)" :disabled="page === 1">Previous</button>
              <template x-for="n in totalPages" :key="n">
                <button type="button" @click="goTo(n)" :aria-current="page === n ? 'page' : null"
                        :class="page === n ? 'bg-copper text-white' : 'hover:bg-black/5'"
                        class="min-w-8 rounded-sm px-2 py-1.5 font-semibold" x-text="n"></button>
              </template>
              <button type="button" class="rounded-sm px-3 py-1.5 hover:bg-black/5 disabled:opacity-30 disabled:hover:bg-transparent" @click="goTo(page + 1)" :disabled="page === totalPages">Next</button>
            </nav>
          </div>

          <!-- ===== Calendar view ===== -->
          <div x-show="view === 'calendar'" x-cloak class="p-5 sm:p-6" :aria-busy="monthLoading">
            <div class="flex flex-wrap items-center justify-between gap-3">
              <h3 class="text-xl" x-text="monthLabel" aria-live="polite"></h3>
              <div class="flex items-center gap-1">
                <button type="button" class="btn btn-ghost px-3 py-1.5 text-ink" @click="goToToday()">Today</button>
                <button type="button" class="rounded-sm p-2 hover:bg-black/5" @click="shiftMonth(-1)" aria-label="Previous month">
                  <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
                </button>
                <button type="button" class="rounded-sm p-2 hover:bg-black/5" @click="shiftMonth(1)" aria-label="Next month">
                  <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
                </button>
              </div>
            </div>

            <p x-show="monthError" x-cloak class="mt-4 text-sm text-red-700">
              <span x-text="monthError"></span>
              <button type="button" class="ml-2 font-semibold text-copper-dark hover:underline" @click="load()">Try again</button>
            </p>

            <div class="mt-4 grid grid-cols-7 border-l border-t border-black/10 text-xs" :class="monthLoading && 'opacity-50'">
              <template x-for="d in weekdays" :key="d">
                <div class="border-b border-r border-black/10 bg-cream/60 px-2 py-2 text-center font-semibold uppercase tracking-wider text-muted" x-text="d"></div>
              </template>
              <template x-for="cell in cells" :key="cell.date">
                <div class="min-h-14 min-w-0 cursor-pointer border-b border-r border-black/10 p-1 sm:min-h-28 sm:p-1.5"
                     :class="[!cell.inMonth && 'bg-cream/50 text-muted', selectedDay === cell.date && 'ring-2 ring-inset ring-copper']"
                     @click="selectedDay = cell.date">
                  <button type="button" class="flex size-6 items-center justify-center rounded-full text-xs font-semibold"
                          :class="cell.isToday ? 'bg-copper text-white' : 'hover:bg-black/5'"
                          :aria-label="cell.date + ', ' + cell.items.length + ' appointments'" :aria-current="cell.isToday ? 'date' : null"
                          @click.stop="selectedDay = cell.date" x-text="cell.day"></button>

                  <!-- Wide screens: the first few appointments as chips -->
                  <div class="mt-1 hidden space-y-1 sm:block">
                    <template x-for="item in cell.items.slice(0, 3)" :key="item.id">
                      <button type="button" class="flex w-full items-center gap-1 rounded-sm px-1.5 py-0.5 text-left text-[11px] font-semibold ring-1"
                              :class="statusClass(item.app_status)" @click.stop="selectedDay = cell.date; openRow(item)">
                        <span x-show="needsAssignment(item) && !['DONE', 'CANCELLED'].includes(item.app_status)" class="size-1.5 shrink-0 rounded-full bg-red-600" title="Needs an LSP or lawyer"></span>
                        <span class="shrink-0 font-normal" x-text="timeOf(item)"></span>
                        <span class="truncate" x-text="item.title"></span>
                      </button>
                    </template>
                    <button type="button" x-show="cell.items.length > 3" class="px-1.5 text-[11px] font-semibold text-copper-dark hover:underline"
                            @click.stop="selectedDay = cell.date" x-text="'+' + (cell.items.length - 3) + ' more'"></button>
                  </div>

                  <!-- Phones: just a count; the day's list is below the grid -->
                  <p x-show="cell.items.length" class="mt-1 text-center text-[11px] font-semibold text-copper-dark sm:hidden" x-text="cell.items.length"></p>
                </div>
              </template>
            </div>

            <!-- Selected day -->
            <div class="mt-6">
              <h3 class="text-lg" x-text="selectedLabel"></h3>
              <p x-show="!selectedItems.length" class="mt-2 text-sm text-muted">Nothing scheduled that day<span x-show="hasFilters"> with these filters</span>.</p>
              <ul x-show="selectedItems.length" class="mt-3 divide-y divide-black/5 rounded-md ring-1 ring-black/10">
                <template x-for="item in selectedItems" :key="item.id">
                  <li>
                    <button type="button" class="flex w-full flex-wrap items-center gap-x-4 gap-y-1 px-4 py-3 text-left text-sm hover:bg-cream/50" @click="openRow(item)">
                      <span class="w-20 shrink-0 font-semibold" x-text="timeOf(item)"></span>
                      <span class="min-w-0 flex-1 truncate" x-text="item.title"></span>
                      <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1" :class="statusClass(item.app_status)" x-text="statusLabel(item.app_status)"></span>
                      <span class="text-xs" :class="!item.lsp_name && 'italic text-muted'" x-text="'LSP: ' + (item.lsp_name || 'none')"></span>
                      <span class="text-xs" :class="!item.sl_name && 'italic text-muted'" x-text="'SL: ' + (item.sl_name || 'none')"></span>
                    </button>
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- ================= Appointment sheet (slides in from the right) ================= -->
  <div x-show="sheetOpen" x-cloak class="fixed inset-0 z-50" @keydown.escape.window="closeSheet()">
    <div class="absolute inset-0 bg-black/40" x-show="sheetOpen" x-transition.opacity.duration.200ms @click="closeSheet()"></div>
    <aside role="dialog" aria-modal="true" aria-labelledby="sheet-title" x-show="sheetOpen"
           x-transition:enter="transition ease-out duration-200" x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
           x-transition:leave="transition ease-in duration-150" x-transition:leave-start="translate-x-0" x-transition:leave-end="translate-x-full"
           class="absolute inset-y-0 right-0 flex w-full max-w-md flex-col bg-cream text-ink shadow-xl">
      <div class="flex items-start justify-between gap-4 border-b border-black/10 px-5 py-4">
        <div class="min-w-0">
          <p class="eyebrow"><span x-text="current?.reference || 'Appointment'"></span></p>
          <h2 id="sheet-title" class="mt-1 truncate text-2xl" x-text="current?.title || (detailLoading ? 'Loading…' : 'Appointment')"></h2>
          <p class="mt-1 text-sm text-muted" x-show="current" x-text="current?.scheduled_at ? formatSchedule(current.scheduled_at) : 'No date yet'"></p>
        </div>
        <button type="button" x-ref="sheetClose" class="-mr-2 rounded-sm p-2 text-muted hover:bg-black/5 hover:text-ink" @click="closeSheet()" aria-label="Close">
          <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <div class="flex-1 space-y-6 overflow-y-auto p-5">
        <p x-show="detailLoading && !current" class="py-12 text-center text-muted">Loading appointment…</p>
        <p x-show="detailError" x-text="detailError" class="rounded-md bg-red-50 px-4 py-3 text-sm text-red-800 ring-1 ring-red-200"></p>

        <template x-if="current">
          <div class="space-y-6">
            <dl class="grid grid-cols-[5.5rem_1fr] gap-x-4 gap-y-2 text-sm">
              <dt class="text-muted">Status</dt>
              <dd><span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold ring-1" :class="statusClass(current.app_status)" x-text="statusLabel(current.app_status)"></span></dd>
              <dt class="text-muted">Mobile</dt>
              <dd><a x-show="current.mobile_no" :href="'tel:' + (current.mobile_no || '').replace(/[^0-9+]/g, '')" class="hover:underline" x-text="current.mobile_no"></a><span x-show="!current.mobile_no">—</span></dd>
              <dt class="text-muted">Email</dt>
              <dd class="break-all"><a x-show="current.email" :href="'mailto:' + current.email" class="hover:underline" x-text="current.email"></a><span x-show="!current.email">—</span></dd>
              <dt class="text-muted" x-show="urgencyOf(current.urgency) || current.client_urgent">Urgency</dt>
              <dd x-show="urgencyOf(current.urgency) || current.client_urgent" x-text="[urgencyOf(current.urgency)?.label, current.client_urgent && 'Client says urgent'].filter(Boolean).join(' · ')"></dd>
            </dl>

            <!-- Annex C -->
            <a x-show="needsReceiving(current)" :href="'clinic-intake.html#' + current.id" class="btn btn-primary w-full">Receive intake (Annex C)</a>
            <a x-show="current.intake_id" :href="'clinic-annex-c.html#' + current.intake_id" target="_blank" rel="noopener" class="btn btn-ghost w-full text-ink">Print / save Annex C</a>

            <form class="card space-y-5" @submit.prevent="saveUpdate()">
              <div>
                <h3 class="text-xl">Status &amp; assignment</h3>
                <p class="mt-1 text-sm text-muted">Each update is added to the history, with your name.</p>
              </div>
              <div>
                <span class="field-label">Status</span>
                <div class="flex flex-wrap gap-2">
                  <template x-for="s in statuses" :key="s.value">
                    <label class="pill" :class="statusLocked(s.value) && 'cursor-not-allowed opacity-50'"><input type="radio" class="accent-copper" :value="s.value" x-model="update.app_status" :disabled="statusLocked(s.value)"> <span x-text="s.label"></span></label>
                  </template>
                </div>
                <p x-show="statusLocked('WIP')" class="field-hint">In progress and Done open up once the intake (Annex C) is received.</p>
              </div>
              <div>
                <label for="s-lsp" class="field-label">Law student practitioner (LSP)</label>
                <select id="s-lsp" x-model="update.lsp_id" class="field">
                  <option value="">Not assigned</option>
                  <template x-for="p in practitioners" :key="p.id"><option :value="p.id" x-text="personOption(p)" :selected="p.id === update.lsp_id"></option></template>
                </select>
                <p x-show="!practitioners.length" class="field-hint">No practitioners yet. Add them on the Practitioners page.</p>
              </div>
              <div>
                <label for="s-sl" class="field-label">Supervising lawyer (SL)</label>
                <select id="s-sl" x-model="update.sl_id" class="field">
                  <option value="">Not assigned</option>
                  <template x-for="l in lawyers" :key="l.id"><option :value="l.id" x-text="personOption(l)" :selected="l.id === update.sl_id"></option></template>
                </select>
                <p x-show="!lawyers.length" class="field-hint">No lawyers yet. Add them on the Lawyers page.</p>
              </div>
              <div>
                <label for="s-remarks" class="field-label">Remarks <span class="font-normal text-muted">(optional)</span></label>
                <textarea id="s-remarks" rows="2" x-model="update.remarks" class="field" placeholder="e.g. Rescheduled at the client's request"></textarea>
              </div>
              <p x-show="updateError" x-text="updateError" role="alert" class="field-error"></p>
              <button type="submit" class="btn btn-primary w-full" :disabled="!updateChanged || updating" x-text="updating ? 'Saving…' : 'Save update'"></button>
            </form>

            <section class="card">
              <h3 class="text-xl">History</h3>
              <p x-show="!history.length" class="mt-2 text-sm text-muted">No updates yet. This appointment is pending.</p>
              <ol class="mt-4 space-y-4">
                <template x-for="entry in history" :key="entry.id">
                  <li class="border-l-2 border-copper/30 pl-4">
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="inline-flex rounded-full px-2 py-0.5 text-[11px] font-semibold ring-1" :class="statusClass((entry.app_status || '').trim())" x-text="statusLabel((entry.app_status || '').trim())"></span>
                      <span class="text-xs text-muted" x-text="formatSchedule(entry.created)"></span>
                    </div>
                    <p class="mt-1 text-sm">
                      <span class="text-muted">LSP:</span> <span x-text="historyPerson(entry, 'lsp_id') || '—'"></span>
                      <span class="ml-3 text-muted">SL:</span> <span x-text="historyPerson(entry, 'sl_id') || '—'"></span>
                    </p>
                    <p x-show="entry.remarks" class="mt-1 text-sm italic" x-text="entry.remarks"></p>
                    <p x-show="historyAuthor(entry)" class="mt-1 text-xs text-muted" x-text="'by ' + historyAuthor(entry)"></p>
                  </li>
                </template>
              </ol>
            </section>

            <a :href="'clinic-appointments.html#' + current.id" class="block text-center text-sm font-semibold text-copper-dark hover:underline">Open the full record (form answers, edit details) &rarr;</a>
          </div>
        </template>
      </div>
    </aside>
  </div>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-transition.opacity role="status" aria-live="polite"
       class="fixed inset-x-4 bottom-4 z-[60] mx-auto max-w-md rounded-md bg-ink px-5 py-3 text-sm text-white shadow-lg sm:left-auto sm:right-6 sm:mx-0"
       x-text="toast"></div>
</body>
</html>
